[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
script = "script"
test = "test"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
mantle = "${MANTLE_MAINNET_RPC_URL}"
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"
mantle_sepolia_quicknode = "${MANTLE_SEPOLIA_QUICKNODE_HTTP_URL}"
