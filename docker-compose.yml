services:
  foundry:
    build:
      context: .
      dockerfile: Dockerfile
      target: foundry
    container_name: rwa-foundry
    working_dir: /workspace/contracts
    volumes:
      - ./:/workspace
    tty: true
    stdin_open: true
    command:
      - bash
      - -lc
      - >
        if [ ! -d lib/forge-std ]; then
          forge install foundry-rs/forge-std;
        fi;
        if [ ! -d lib/openzeppelin-contracts ]; then
          forge install OpenZeppelin/openzeppelin-contracts;
        fi;
        tail -f /dev/null
  db:
    image: postgres:15-alpine
    container_name: rwa-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aixrwa
    ports:
      - "5432:5432"
    volumes:
      - rwa-db-data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:latest
    container_name: rwa-ollama
    ports:
      - "11434:11434"
    volumes:
      - rwa-ollama-data:/root/.ollama
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: rwa-backend
    working_dir: /workspace
    depends_on:
      - db
    env_file:
      - ./services/agent/.env.example
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aixrwa
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - services.agent.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  rwa-db-data:
  rwa-ollama-data:
