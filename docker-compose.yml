services:
  postgres:
    image: postgres:16-alpine
    container_name: rwa-postgres
    environment:
      POSTGRES_DB: aixrwa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d aixrwa
      interval: 5s
      timeout: 5s
      retries: 10

  foundry:
    build:
      context: .
      dockerfile: Dockerfile
      target: foundry
    container_name: rwa-foundry
    working_dir: /workspace/contracts
    volumes:
      - ./:/workspace
    tty: true
    stdin_open: true
    command:
      - bash
      - -lc
      - >
        if [ ! -d lib/forge-std ]; then
          forge install foundry-rs/forge-std;
        fi;
        if [ ! -d lib/openzeppelin-contracts ]; then
          forge install OpenZeppelin/openzeppelin-contracts;
        fi;
        tail -f /dev/null
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: rwa-backend
    working_dir: /workspace
    env_file:
      - ./services/agent/.env.example
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/aixrwa
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - services.agent.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  postgres-data:
