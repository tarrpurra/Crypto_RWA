services:
  postgres:
    image: postgres:16-alpine
    container_name: rwa-postgres
    environment:
      POSTGRES_DB: aixrwa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d aixrwa
      interval: 5s
      timeout: 5s
      retries: 10

  foundry:
    build:
      context: .
      dockerfile: Dockerfile
      target: foundry
    container_name: rwa-foundry
    working_dir: /workspace/contracts
    env_file:
      - ./contracts/.env
      - ./services/agent/.env
    volumes:
      - ./:/workspace
    tty: true
    stdin_open: true
    command:
      - bash
      - -lc
      - >
        if [ ! -d lib/forge-std ]; then
          forge install foundry-rs/forge-std;
        fi;
        if [ ! -d lib/openzeppelin-contracts ]; then
          forge install OpenZeppelin/openzeppelin-contracts;
        fi;
        tail -f /dev/null

  ollama:
    image: ollama/ollama:latest
    container_name: rwa-ollama
    ports:
      - "11434:11434"
    volumes:
      - rwa-ollama-data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: rwa-backend
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./services/agent/.env.docker.test
      - ./services/agent/.env
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/aixrwa
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - services.agent.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: rwa-frontend
    working_dir: /workspace/frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:8080"
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "8080"

volumes:
  postgres-data:
  rwa-ollama-data:
